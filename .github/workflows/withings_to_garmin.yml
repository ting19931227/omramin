name: Sync Withings to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      secrets: write
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install garminconnect garth requests pynacl

      - name: Sync Weight and Fat to Garmin
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_USER_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_PROXY: ${{ secrets.GARMIN_PROXY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import datetime
          import base64
          import requests
          import garth
          from garminconnect import Garmin
          from nacl import encoding, public

          # 1. 讀取 Withings 憑證並換票
          withings_raw = os.environ.get('WITHINGS_USER_JSON', '').strip()
          client_id = os.environ.get('WITHINGS_CLIENT_ID', '').strip()
          client_secret = os.environ.get('WITHINGS_CLIENT_SECRET', '').strip()

          if not withings_raw:
              print("Error: WITHINGS_USER_JSON is empty.")
              sys.exit(1)

          user_data = json.loads(withings_raw)
          refresh_token = user_data.get('refresh_token')
          access_token = user_data.get('access_token')

          if refresh_token:
              print("Refreshing Withings token...")
              t_res = requests.post("https://wbsapi.withings.net/v2/oauth2", data={
                  "action": "requesttoken",
                  "grant_type": "refresh_token",
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "refresh_token": refresh_token
              }, timeout=10).json()

              if t_res.get("status") == 0:
                  access_token = t_res["body"]["access_token"]
                  new_body = t_res["body"]
                  print("Withings token refreshed successfully!")

                  # 自動將最新的 Token 存回 GitHub Secrets
                  gh_token = os.environ.get("GITHUB_TOKEN")
                  repo = os.environ.get("REPO_NAME")
                  if gh_token and repo:
                      try:
                          headers = {
                              "Authorization": f"token {gh_token}",
                              "Accept": "application/vnd.github.v3+json"
                          }
                          key_data = requests.get(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=headers).json()
                          public_key_b64 = key_data.get("key")
                          key_id = key_data.get("key_id")

                          if public_key_b64 and key_id:
                              public_key = public.PublicKey(public_key_b64.encode("utf-8"), encoding.Base64Encoder())
                              sealed_box = public.SealedBox(public_key)
                              encrypted = sealed_box.encrypt(json.dumps(new_body).encode("utf-8"))
                              encrypted_b64 = base64.b64encode(encrypted).decode("utf-8")

                              put_res = requests.put(
                                  f"https://api.github.com/repos/{repo}/actions/secrets/WITHINGS_USER_JSON",
                                  headers=headers,
                                  json={"encrypted_value": encrypted_b64, "key_id": key_id}
                              )
                              if put_res.status_code in [201, 204]:
                                  print("  [Auto-Save] Successfully updated WITHINGS_USER_JSON Secret for next sync!")
                      except Exception as sec_err:
                          print(f"  [Notice] Could not auto-update secret: {sec_err}")
              else:
                  print(f"Token notice: {t_res.get('error')}, using current access token...")

          # 2. 以台灣時間（UTC+8）今天凌晨 00:00:00 為查詢起點
          tz_tw = datetime.timezone(datetime.timedelta(hours=8))
          now_tw = datetime.datetime.now(tz_tw)
          today_midnight_tw = datetime.datetime(now_tw.year, now_tw.month, now_tw.day, 0, 0, 0, tzinfo=tz_tw)
          start_ts = int(today_midnight_tw.timestamp())
          print(f"Fetching measurements from Withings (Today only: >= {today_midnight_tw})...")

          m_res = requests.post(
              "https://wbsapi.withings.net/measure",
              headers={"Authorization": f"Bearer {access_token}"},
              data={
                  "action": "getmeas",
                  "category": 1,
                  "startdate": start_ts
              },
              timeout=10
          ).json()

          if m_res.get("status") != 0:
              print(f"Failed to fetch measurements: {m_res}")
              sys.exit(1)

          meas_grps = m_res.get("body", {}).get("measuregrps", [])
          records = []
          for grp in meas_grps:
              epoch = grp.get("date")
              dt_tw = datetime.datetime.fromtimestamp(epoch, tz=tz_tw)
              local_time_str = dt_tw.strftime("%Y-%m-%d %H:%M:%S")

              weight = None
              fat = None
              for m in grp.get("measures", []):
                  m_type = m.get("type")
                  real_val = m.get("value") * (10 ** m.get("unit"))
                  if m_type == 1:
                      weight = round(real_val, 2)
                  elif m_type == 6:
                      fat = round(real_val, 2)

              if weight is not None:
                  records.append({
                      "local_str": local_time_str,
                      "epoch": epoch,
                      "weight": weight,
                      "fat": fat
                  })

          if not records:
              print("No weight measurements recorded today.")
              sys.exit(0)

          records.sort(key=lambda x: x["epoch"])
          print(f"Found {len(records)} record(s) from today to sync.")

          # 3. 配置 Garmin 連線
          proxy = os.environ.get('GARMIN_PROXY', '').strip()
          if proxy:
              garth.client.sess.proxies = {"http": proxy, "https": proxy}

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          try:
              if hasattr(garth.client, "refresh_oauth2"):
                  garth.client.refresh_oauth2()
                  print("Garmin Token refreshed successfully via Proxy!")
          except Exception as e:
              print(f"Token notice: {e}")

          oauth2 = getattr(garth.client, "oauth2_token", None)
          token_str = oauth2.get("access_token") if isinstance(oauth2, dict) else getattr(oauth2, "access_token", None)

          if hasattr(garth.client, "sess") and hasattr(garth.client.sess, "headers"):
              garth.client.sess.headers.update({
                  "Authorization": f"Bearer {token_str}",
                  "Origin": "https://connect.garmin.com",
                  "Referer": "https://connect.garmin.com/",
                  "di-backend": "connectapi.garmin.com",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              })

          garmin = Garmin(is_cn=False)
          garmin.client = garth.client

          # 4. 上傳體重與體脂率
          success_count = 0
          for r in records:
              date_str = r['local_str']
              print(f"Uploading: {date_str} -> Weight: {r['weight']} kg, Fat: {r['fat']}%")
              uploaded = False

              for method_name in ["set_body_composition", "add_body_composition", "add_weigh_in"]:
                  if hasattr(garmin, method_name):
                      try:
                          fn = getattr(garmin, method_name)
                          kwargs = {"weight": r["weight"], "timestamp": date_str}
                          varnames = fn.__code__.co_varnames
                          if r["fat"] is not None and "percent_fat" in varnames:
                              kwargs["percent_fat"] = r["fat"]
                          elif r["fat"] is not None and "fat" in varnames:
                              kwargs["fat"] = r["fat"]
                          fn(**kwargs)
                          print(f"  [OK] Uploaded via garmin.{method_name}!")
                          uploaded = True
                          break
                      except Exception:
                          pass

              if not uploaded:
                  payload = {
                      "weight": r["weight"] * 1000,
                      "date": date_str.split(" ")[0],
                      "timestamp": r["epoch"] * 1000
                  }
                  if r["fat"] is not None:
                      payload["percentFat"] = r["fat"]

                  for ep in ["weight-service/weight-record", "weight-service/weight/userTransactionRecord"]:
                      try:
                          res = garth.client.post("connectapi", ep, json=payload)
                          if res.status_code in [200, 201, 204]:
                              print(f"  [OK] Uploaded via {ep} (HTTP {res.status_code})")
                              uploaded = True
                              break
                      except Exception:
                          pass

              if uploaded:
                  success_count += 1

          print(f"\nSync completed: {success_count}/{len(records)} record(s) synced to Garmin Connect.")
          EOF
