name: Sync Withings to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install garminconnect garth requests

      - name: Sync Weight and Fat to Garmin
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_USER_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_PROXY: ${{ secrets.GARMIN_PROXY }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import datetime
          import requests
          import garth

          # 1. 解析 Withings 憑證內容
          withings_raw = os.environ.get('WITHINGS_USER_JSON', '').strip()
          client_id = os.environ.get('WITHINGS_CLIENT_ID', '').strip()
          client_secret = os.environ.get('WITHINGS_CLIENT_SECRET', '').strip()

          if not withings_raw:
              print("Error: WITHINGS_USER_JSON is empty.")
              sys.exit(1)

          user_data = json.loads(withings_raw)

          # 探測 token 位置 (相容多種格式)
          refresh_token = user_data.get('refresh_token') or user_data.get('credentials', {}).get('refresh_token')
          access_token = user_data.get('access_token') or user_data.get('credentials', {}).get('access_token')

          # 2. 向 Withings 刷新 Access Token
          if refresh_token and client_id and client_secret:
              print("Refreshing Withings token...")
              token_url = "https://wbsapi.withings.net/v2/oauth2"
              payload = {
                  "action": "requesttoken",
                  "grant_type": "refresh_token",
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "refresh_token": refresh_token
              }
              try:
                  t_res = requests.post(token_url, data=payload, timeout=10).json()
                  if t_res.get("status") == 0:
                      access_token = t_res["body"]["access_token"]
                      print("Withings token refreshed successfully!")
                  else:
                      print(f"Token refresh notice: {t_res.get('error')}, trying existing access_token...")
              except Exception as e:
                  print(f"Refresh failed with error: {e}")

          if not access_token:
              print("Error: No valid Withings access_token available.")
              sys.exit(1)

          # 3. 取得 Withings 量測資料（過去 7 天）
          print("Fetching measurements from Withings...")
          meas_url = "https://wbsapi.withings.net/measure"
          start_ts = int((datetime.datetime.now() - datetime.timedelta(days=7)).timestamp())
          
          m_res = requests.post(
              meas_url,
              headers={"Authorization": f"Bearer {access_token}"},
              data={
                  "action": "getmeas",
                  "category": 1,
                  "startdate": start_ts
              },
              timeout=10
          ).json()

          if m_res.get("status") != 0:
              print(f"Failed to fetch measurements: {m_res}")
              sys.exit(1)

          meas_grps = m_res.get("body", {}).get("measuregrps", [])
          print(f"Found {len(meas_grps)} measurement group(s) from Withings.")

          # 4. 解析體重 (type 1) 與體脂率 (type 6)
          records = []
          for grp in meas_grps:
              epoch = grp.get("date")
              dt = datetime.datetime.fromtimestamp(epoch)
              weight = None
              fat = None

              for m in grp.get("measures", []):
                  m_type = m.get("type")
                  # value * 10^unit
                  real_val = m.get("value") * (10 ** m.get("unit"))
                  if m_type == 1:
                      weight = round(real_val, 2)
                  elif m_type == 6:
                      fat = round(real_val, 2)

              if weight is not None:
                  records.append({
                      "dt": dt,
                      "epoch": epoch,
                      "weight": weight,
                      "fat": fat
                  })

          if not records:
              print("No weight measurements recorded in the last 7 days.")
              sys.exit(0)

          # 5. 配置 Garmin 連線（Token + Proxy）
          proxy = os.environ.get('GARMIN_PROXY', '').strip()
          if proxy:
              garth.client.sess.proxies = {"http": proxy, "https": proxy}

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          try:
              if hasattr(garth.client, "refresh_oauth2"):
                  garth.client.refresh_oauth2()
                  print("Garmin Token refreshed successfully via Proxy!")
          except Exception as e:
              print(f"Token notice: {e}")

          # 6. 上傳至 Garmin Connect
          success_count = 0
          for r in records:
              # Garmin weight-service 欄位：weight (公克), date, timestamp (毫秒)
              upload_payload = {
                  "weight": r["weight"] * 1000,
                  "date": r["dt"].strftime("%Y-%m-%d"),
                  "timestamp": r["epoch"] * 1000
              }
              if r["fat"] is not None:
                  upload_payload["percentFat"] = r["fat"]

              print(f"Uploading: {r['dt']} -> Weight: {r['weight']} kg, Fat: {r['fat']}%")
              try:
                  resp = garth.client.post("connectapi", "weight-service/weight/dateRecords", json=upload_payload)
                  if resp.status_code in [200, 201, 204]:
                      print(f"  [OK] Uploaded successfully (HTTP {resp.status_code})")
                      success_count += 1
                  else:
                      print(f"  [Notice] Response {resp.status_code}: {resp.text}")
              except Exception as err:
                  print(f"  [Error] Upload failed: {err}")

          print(f"All done! Successfully synced {success_count}/{len(records)} record(s) to Garmin.")
          EOF
