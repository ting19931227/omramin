name: Sync Withings to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *' # 每天台灣時間 20:15 自動執行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install withings-sync garminconnect garth requests

      - name: Restore Tokens & Sync to Garmin
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_USER_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_USERNAME: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_PROXY: ${{ secrets.GARMIN_PROXY }}
          HTTPS_PROXY: ${{ secrets.GARMIN_PROXY }}
          HTTP_PROXY: ${{ secrets.GARMIN_PROXY }}
          ALL_PROXY: ${{ secrets.GARMIN_PROXY }}
        run: |
          # 1. 還原 Withings 授權 Token
          echo "$WITHINGS_USER_JSON" > ~/.withings_user.json

          # 2. 如果有 Garmin Token，將其寫入預設憑證目錄以確保 withings-sync 讀取
          if [ -n "$GARMIN_TOKENS" ]; then
            mkdir -p ~/.garth
            mkdir -p ~/.garminconnect
            echo "$GARMIN_TOKENS" > ~/.garth/tokens.json
            echo "$GARMIN_TOKENS" > ~/.garminconnect/tokens.json
            echo "$GARMIN_TOKENS" > ~/.garminconnect.json
          fi

          # 3. 執行同步，並透過全域代理避開 Cloudflare 403 阻擋
          withings-sync \
            --garmin-username "$GARMIN_USERNAME" \
            --garmin-password "$GARMIN_PASSWORD" \
            --fromdate $(date -d "7 days ago" +%Y-%m-%d)
