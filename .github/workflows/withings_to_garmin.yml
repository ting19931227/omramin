name: Sync Withings to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install garminconnect garth requests withings-sync

      - name: Sync Weight and Fat to Garmin
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_USER_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_PROXY: ${{ secrets.GARMIN_PROXY }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import datetime
          import io
          import requests
          import garth
          from withings_sync.fit import Fit
          from withings_sync.measurement import MeasurementGroup, Measurement

          # 1. 讀取 Withings 憑證並自動換票
          withings_raw = os.environ.get('WITHINGS_USER_JSON', '').strip()
          client_id = os.environ.get('WITHINGS_CLIENT_ID', '').strip()
          client_secret = os.environ.get('WITHINGS_CLIENT_SECRET', '').strip()

          if not withings_raw:
              print("Error: WITHINGS_USER_JSON is empty.")
              sys.exit(1)

          user_data = json.loads(withings_raw)
          refresh_token = user_data.get('refresh_token')
          access_token = user_data.get('access_token')

          if refresh_token:
              print("Refreshing Withings token...")
              t_res = requests.post("https://wbsapi.withings.net/v2/oauth2", data={
                  "action": "requesttoken",
                  "grant_type": "refresh_token",
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "refresh_token": refresh_token
              }, timeout=10).json()
              if t_res.get("status") == 0:
                  access_token = t_res["body"]["access_token"]
                  print("Withings token refreshed successfully!")
              else:
                  print("Notice: using current access token...")

          # 2. 以台灣時間今天凌晨 00:00:00 為查詢起點
          tz_tw = datetime.timezone(datetime.timedelta(hours=8))
          now_tw = datetime.datetime.now(tz_tw)
          today_midnight_tw = datetime.datetime(now_tw.year, now_tw.month, now_tw.day, 0, 0, 0, tzinfo=tz_tw)
          start_ts = int(today_midnight_tw.timestamp())
          print(f"Fetching measurements from Withings (Today only: >= {today_midnight_tw})...")

          m_res = requests.post(
              "https://wbsapi.withings.net/measure",
              headers={"Authorization": f"Bearer {access_token}"},
              data={
                  "action": "getmeas",
                  "category": 1,
                  "startdate": start_ts
              },
              timeout=10
          ).json()

          if m_res.get("status") != 0:
              print(f"Failed to fetch measurements: {m_res}")
              sys.exit(1)

          meas_grps = m_res.get("body", {}).get("measuregrps", [])
          if not meas_grps:
              print("No weight measurements recorded today.")
              sys.exit(0)

          # 3. 轉換為 Withings-Sync 標準 MeasurementGroup
          groups = []
          for grp in meas_grps:
              epoch = grp.get("date")
              meas_list = []
              has_weight = False
              for m in grp.get("measures", []):
                  m_type = m.get("type")
                  raw_val = m.get("value")
                  unit = m.get("unit")
                  if m_type == 1:
                      has_weight = True
                  meas_list.append(Measurement(m_type, raw_val, unit))

              if has_weight:
                  dt_utc = datetime.datetime.fromtimestamp(epoch, tz=datetime.timezone.utc).replace(tzinfo=None)
                  mg = MeasurementGroup(dt_utc, meas_list)
                  groups.append(mg)

          if not groups:
              print("No valid weight data found in today's records.")
              sys.exit(0)

          groups.sort(key=lambda x: x.date)
          print(f"Prepared {len(groups)} valid measurement(s) for FIT encoding.")

          # 4. 打包為 FIT 二進位檔案
          fit = Fit()
          for grp in groups:
              fit.parse(grp)
          fit_data = fit.to_bytes()

          if not fit_data:
              print("Error: Generated FIT binary is empty.")
              sys.exit(1)

          print(f"Generated FIT file ({len(fit_data)} bytes).")

          # 5. 配置 Garmin 連線並換票
          proxy = os.environ.get('GARMIN_PROXY', '').strip()
          if proxy:
              garth.client.sess.proxies = {"http": proxy, "https": proxy}

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          try:
              if hasattr(garth.client, "refresh_oauth2"):
                  garth.client.refresh_oauth2()
                  print("Garmin Token refreshed successfully via Proxy!")
          except Exception as e:
              print(f"Token notice: {e}")

          # 6. 透過 Garmin 官方上傳端點上傳 FIT 檔案
          print("Uploading FIT file to Garmin Connect...")
          files = {
              "file": ("weight.fit", io.BytesIO(fit_data), "application/octet-stream")
          }
          upload_res = garth.client.post("connectapi", "upload-service/upload", files=files)

          if upload_res.status_code in [200, 201, 202, 204]:
              print(f"Upload successful! HTTP {upload_res.status_code}")
              print("Measurements successfully synced to Garmin Connect.")
          else:
              print(f"Upload failed: HTTP {upload_res.status_code} - {upload_res.text}")
              sys.exit(1)
          EOF
