name: Sync Withings to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install withings-sync garminconnect garth requests

      - name: Sync Withings to Garmin
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_USER_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_PROXY: ${{ secrets.GARMIN_PROXY }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import io
          import datetime
          import garth
          from garminconnect import Garmin
          from withings_sync.sync import WithingsAccount
          from withings_sync.garmin import GarminConnect
          import withings_sync.fit as fit_module

          # 1. 還原 Withings 憑證檔
          withings_json = os.environ.get('WITHINGS_USER_JSON')
          if not withings_json:
              print("Error: WITHINGS_USER_JSON is missing.")
              sys.exit(1)
          home_dir = os.path.expanduser('~')
          with open(os.path.join(home_dir, '.withings_user.json'), 'w') as f:
              f.write(withings_json)

          # 2. 掛載 Proxy 避免 Garmin 換票被 429 阻擋
          proxy = os.environ.get('GARMIN_PROXY', '').strip()
          if proxy:
              garth.client.sess.proxies = {"http": proxy, "https": proxy}

          # 3. 載入並刷新 Garmin Token
          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)
          garth.client.loads(garmin_tokens)
          try:
              if hasattr(garth.client, "refresh_oauth2"):
                  garth.client.refresh_oauth2()
                  print("Garmin Token refreshed successfully!")
          except Exception as e:
              print(f"Token notice: {e}")

          # 4. 接管 GarminConnect 物件，注入已驗證的 client
          garmin_sync = GarminConnect()
          garmin_sync.client = Garmin(is_cn=False)
          garmin_sync.client.client = garth.client

          # 5. 抓取 Withings 數據
          print("Fetching measurements from Withings...")
          withings = WithingsAccount()
          today = datetime.date.today()
          start_date = today - datetime.timedelta(days=7)
          groups = withings.get_measurements(startdate=start_date, enddate=today)

          # 6. 動態產生 FIT 內容並調用 upload_file 上傳
          fit_obj = fit_module.Fit()
          fit_data = None

          # 兼容不同版本的 FIT 生成方法
          for parse_method in ["parse", "write", "generate", "create"]:
              if hasattr(fit_obj, parse_method):
                  getattr(fit_obj, parse_method)(groups)
                  break

          for bytes_method in ["to_bytes", "getvalue", "get_bytes"]:
              if hasattr(fit_obj, bytes_method):
                  fit_data = getattr(fit_obj, bytes_method)()
                  break

          if fit_data is None and hasattr(fit_obj, "fit"):
              underlying = getattr(fit_obj, "fit")
              if hasattr(underlying, "to_bytes"):
                  fit_data = underlying.to_bytes()

          if not fit_data:
              print("Notice: No FIT payload generated.")
              sys.exit(1)

          # 封裝為 BytesIO 供 GarminConnect 上傳
          file_stream = io.BytesIO(fit_data)
          print("Uploading FIT data to Garmin Connect...")
          garmin_sync.upload_file(file_stream)
          print("Upload completed successfully!")
          EOF
