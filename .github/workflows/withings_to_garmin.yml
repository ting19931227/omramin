name: Sync Withings to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install withings-sync garminconnect garth requests

      - name: Sync Weight and Body Fat to Garmin
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_USER_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_PROXY: ${{ secrets.GARMIN_PROXY }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import datetime
          import garth
          import requests

          # 1. 讀取 Withings 憑證並更新 Access Token
          withings_json_str = os.environ.get('WITHINGS_USER_JSON', '').strip()
          client_id = os.environ.get('WITHINGS_CLIENT_ID', '').strip()
          client_secret = os.environ.get('WITHINGS_CLIENT_SECRET', '').strip()

          if not withings_json_str or not client_id or not client_secret:
              print("Error: Missing Withings secrets.")
              sys.exit(1)

          user_data = json.loads(withings_json_str)
          refresh_token = user_data.get('refresh_token')

          print("Refreshing Withings token...")
          token_resp = requests.post("https://wbsapi.withings.net/v2/oauth2", data={
              "action": "requesttoken",
              "grant_type": "refresh_token",
              "client_id": client_id,
              "client_secret": client_secret,
              "refresh_token": refresh_token
          }).json()

          if token_resp.get("status") != 0:
              print(f"Withings token refresh warning: {token_resp}, using existing token...")
              access_token = user_data.get('access_token')
          else:
              access_token = token_resp["body"]["access_token"]
              print("Withings token refreshed successfully!")

          # 2. 向 Withings 抓取過去 7 天的測量資料
          print("Fetching measurements from Withings...")
          start_timestamp = int((datetime.datetime.now() - datetime.timedelta(days=7)).timestamp())
          meas_resp = requests.post("https://wbsapi.withings.net/measure", headers={
              "Authorization": f"Bearer {access_token}"
          }, data={
              "action": "getmeas",
              "meastype": "1,6",  # 1 = Weight, 6 = Fat Percentage
              "category": 1,
              "startdate": start_timestamp
          }).json()

          if meas_resp.get("status") != 0:
              print(f"Failed to fetch measurements: {meas_resp}")
              sys.exit(1)

          meas_groups = meas_resp.get("body", {}).get("measuregrps", [])
          print(f"Retrieved {len(meas_groups)} measurement group(s) from Withings.")

          # 3. 提取體重與體脂率
          records = []
          for grp in meas_groups:
              date_epoch = grp.get("date")
              dt = datetime.datetime.fromtimestamp(date_epoch)
              weight = None
              fat_percent = None

              for m in grp.get("measures", []):
                  m_type = m.get("type")
                  val = m.get("value") * (10 ** m.get("unit"))
                  if m_type == 1:
                      weight = round(val, 2)
                  elif m_type == 6:
                      fat_percent = round(val, 2)

              if weight is not None:
                  records.append({
                      "dt": dt,
                      "epoch": date_epoch,
                      "weight": weight,
                      "fat": fat_percent
                  })

          if not records:
              print("No valid weight data found in the last 7 days.")
              sys.exit(0)

          print(f"Found {len(records)} record(s) to sync.")

          # 4. 配置 Garmin 連線（載入 Token + Webshare 代理）
          proxy = os.environ.get('GARMIN_PROXY', '').strip()
          if proxy:
              garth.client.sess.proxies = {"http": proxy, "https": proxy}

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          try:
              if hasattr(garth.client, "refresh_oauth2"):
                  garth.client.refresh_oauth2()
                  print("Garmin Token refreshed successfully via Proxy!")
          except Exception as e:
              print(f"Token notice: {e}")

          # 5. 上傳體重與體脂率至 Garmin Connect
          for r in records:
              payload = {
                  "weight": r["weight"] * 1000, # Garmin 接受公克 (g)
                  "date": r["dt"].strftime("%Y-%m-%d"),
                  "timestamp": r["epoch"] * 1000
              }
              if r["fat"] is not None:
                  payload["percentFat"] = r["fat"]

              print(f"Uploading to Garmin: {r['dt']} -> Weight: {r['weight']} kg, Fat: {r['fat']}%")
              try:
                  res = garth.client.post("connectapi", "weight-service/weight/dateRecords", json=payload)
                  print(f"Upload result: {res.status_code}")
              except Exception as err:
                  print(f"Upload failed: {err}")

          print("Sync completed successfully!")
          EOF
