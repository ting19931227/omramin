name: Sync Withings to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install withings-sync garminconnect garth requests

      - name: Sync Weight and Fat to Garmin
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_USER_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_PROXY: ${{ secrets.GARMIN_PROXY }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import datetime
          import garth
          from withings_sync.sync import WithingsAccount

          # 1. 還原 Withings 授權憑證檔
          withings_json = os.environ.get('WITHINGS_USER_JSON', '').strip()
          if not withings_json:
              print("Error: WITHINGS_USER_JSON is missing.")
              sys.exit(1)

          home_dir = os.path.expanduser('~')
          with open(os.path.join(home_dir, '.withings_user.json'), 'w') as f:
              f.write(withings_json)

          # 2. 透過 WithingsAccount 自動刷新並連線
          print("Connecting to Withings and refreshing credentials...")
          withings = WithingsAccount()
          start_date = datetime.date.today() - datetime.timedelta(days=7)
          groups = withings.get_measurements(startdate=start_date)

          # 3. 提取體重與體脂率
          records = []
          for grp in groups:
              weight = None
              fat = None
              dt = grp.get_datetime()
              epoch = int(dt.timestamp())

              # 檢查該測量組包含的數值
              for meas in grp.measures:
                  # type 1 = Weight, type 6 = Fat Percentage
                  if getattr(meas, 'type', None) == 1:
                      weight = round(meas.get_value(), 2)
                  elif getattr(meas, 'type', None) == 6:
                      fat = round(meas.get_value(), 2)

              if weight is not None:
                  records.append({
                      "dt": dt,
                      "epoch": epoch,
                      "weight": weight,
                      "fat": fat
                  })

          if not records:
              print("No new weight measurements found in the last 7 days.")
              sys.exit(0)

          print(f"Found {len(records)} valid record(s) to sync.")

          # 4. 配置 Garmin 連線（Token + Proxy）
          proxy = os.environ.get('GARMIN_PROXY', '').strip()
          if proxy:
              garth.client.sess.proxies = {"http": proxy, "https": proxy}

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          try:
              if hasattr(garth.client, "refresh_oauth2"):
                  garth.client.refresh_oauth2()
                  print("Garmin Token refreshed successfully via Proxy!")
          except Exception as e:
              print(f"Token notice: {e}")

          # 5. 上傳體重與體脂率至 Garmin Connect
          for r in records:
              payload = {
                  "weight": r["weight"] * 1000, # 轉換為公克 (g)
                  "date": r["dt"].strftime("%Y-%m-%d"),
                  "timestamp": r["epoch"] * 1000
              }
              if r["fat"] is not None:
                  payload["percentFat"] = r["fat"]

              print(f"Uploading to Garmin: {r['dt']} -> Weight: {r['weight']} kg, Fat: {r['fat']}%")
              try:
                  res = garth.client.post("connectapi", "weight-service/weight/dateRecords", json=payload)
                  print(f"Upload result: {res.status_code}")
              except Exception as err:
                  print(f"Upload failed: {err}")

          print("Sync completed successfully!")
          EOF
