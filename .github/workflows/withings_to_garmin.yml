name: Sync Withings to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install withings-sync garminconnect garth requests

      - name: Sync Weight and Fat to Garmin
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_USER_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_PROXY: ${{ secrets.GARMIN_PROXY }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import datetime
          import garth
          import requests
          from withings_sync.sync import WithingsAccount, GarminConnect

          # 1. 還原 Withings 憑證設定檔
          withings_raw = os.environ.get('WITHINGS_USER_JSON', '').strip()
          client_id = os.environ.get('WITHINGS_CLIENT_ID', '').strip()
          client_secret = os.environ.get('WITHINGS_CLIENT_SECRET', '').strip()

          if not withings_raw:
              print("Error: WITHINGS_USER_JSON is empty.")
              sys.exit(1)

          home_dir = os.path.expanduser('~')
          with open(os.path.join(home_dir, '.withings_user.json'), 'w') as f:
              f.write(withings_raw)

          # 2. 自動向 Withings 換票並抓取今日資料
          print("Connecting to Withings and refreshing tokens...")
          withings = WithingsAccount()
          today = datetime.date.today()
          groups = withings.get_measurements(startdate=today, enddate=today)

          if not groups:
              print("No weight measurements recorded today.")
              sys.exit(0)

          # 3. 過濾僅保留體重 (Type 1) 與體脂率 (Type 6)
          filtered_groups = []
          for grp in groups:
              new_measures = []
              has_weight = False
              for m in getattr(grp, 'measures', []):
                  m_type = getattr(m, 'type', None)
                  if m_type == 1:
                      has_weight = True
                      new_measures.append(m)
                  elif m_type == 6:
                      new_measures.append(m)
              if has_weight:
                  grp.measures = new_measures
                  filtered_groups.append(grp)

          if not filtered_groups:
              print("No valid weight data found for today.")
              sys.exit(0)

          print(f"Found {len(filtered_groups)} valid record(s) to sync.")

          # 4. 配置 Garmin 連線（Token + Proxy 續期）
          proxy = os.environ.get('GARMIN_PROXY', '').strip()
          if proxy:
              garth.client.sess.proxies = {"http": proxy, "https": proxy}

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          try:
              if hasattr(garth.client, "refresh_oauth2"):
                  garth.client.refresh_oauth2()
                  print("Garmin Token refreshed successfully via Proxy!")
          except Exception as e:
              print(f"Token notice: {e}")

          # 5. 打包 FIT 並直接上傳至 Garmin Connect
          print("Uploading measurements via FIT encoder...")
          garmin_sync = GarminConnect()
          garmin_sync.client = garth.client
          garmin_sync.upload(filtered_groups)

          print("Sync completed successfully!")
          EOF
