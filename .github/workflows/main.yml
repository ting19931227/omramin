name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read omronconnect try_servers function
        run: |
          echo "=== try_servers definition ==="
          grep -n -A 20 "def try_servers" omronconnect.py
          echo "=== get_devices definition ==="
          grep -n -A 20 "def get_devices" omronconnect.py || true
