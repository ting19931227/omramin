name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Fetch Devices and Measurements
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          from omronconnect import OmronClient

          omron_user = os.environ['OMRON_EMAIL']
          omron_pwd = os.environ['OMRON_PASSWORD']

          client = OmronClient(country='TW')
          client.login(omron_user, omron_pwd)
          print("OMRON Login successful!")

          print("\n=== REGISTERED DEVICES ===")
          try:
              devs = client.get_registered_devices()
              print("Devices:", devs)
          except Exception as e:
              print("Failed to get devices:", e)

          print("\n=== RECENT MEASUREMENTS ===")
          try:
              data = client.get_measurements()
              print(f"Total records fetched: {len(data) if isinstance(data, list) else 'N/A'}")
              print("Sample data:", data[:3] if isinstance(data, list) else data)
          except Exception as e:
              print("Failed to get measurements:", e)
          EOF
