name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上 8 點定時自動同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth httpx

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import time
          from datetime import datetime, timedelta
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          # 1. 載入 Garmin Token Session
          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON 並抓取血壓數據
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          client = omron._active_client
          hx = getattr(client, '_client', None)
          url = f"{client._server}{client._APP_URL}/versions/current/measureData"
          headers = client._headers

          now_ms = int(time.time() * 1000)
          payload = {
              "containCorrectedDataFlag": 1,
              "containAllDataTypeFlag": 1,
              "deviceCategory": "0",
              "searchDateFrom": 0,
              "searchDateTo": now_ms
          }

          resp = hx.post(url, json=payload, headers=headers)
          resp_json = resp.json()

          raw_records = []
          val = resp_json.get("returnedValue", {})
          if isinstance(val, list) and val:
              val = val[0]

          models = val.get("deviceModelList", []) if isinstance(val, dict) else []
          for m in models:
              for s in m.get("deviceSerialIDList", []):
                  raw_records.extend(s.get("measureList", []))

          print(f"\nTotal extracted records from OMRON: {len(raw_records)}")

          # 3. 過濾資料：只同步最近 14 天內的量測（避開 200 筆高頻衝擊觸發 WAF 403）
          cutoff_date = datetime.now() - timedelta(days=14)
          recent_records = []

          for item in raw_records:
              dt_raw = str(item.get("measureDeviceDateFrom") or "")
              dt_obj = None
              if len(dt_raw) >= 14:
                  dt_obj = datetime.strptime(dt_raw[:14], "%Y%m%d%H%M%S")
              else:
                  ts_ms = item.get("measureDateFrom") or item.get("transferDate")
                  if ts_ms:
                      dt_obj = datetime.fromtimestamp(ts_ms / 1000.0)

              if dt_obj and dt_obj >= cutoff_date:
                  item['_parsed_dt'] = dt_obj
                  recent_records.append(item)

          print(f"Filtered to {len(recent_records)} record(s) within the last 14 days.")

          if not recent_records and raw_records:
              print("No records in the last 14 days, taking the latest 3 records instead...")
              # 若最近 14 天內少於 1 筆，抓最新 3 筆測試
              raw_records.sort(key=lambda x: str(x.get("measureDeviceDateFrom") or 0), reverse=True)
              for item in raw_records[:3]:
                  dt_raw = str(item.get("measureDeviceDateFrom") or "")
                  dt_obj = datetime.strptime(dt_raw[:14], "%Y%m%d%H%M%S") if len(dt_raw) >= 14 else datetime.now()
                  item['_parsed_dt'] = dt_obj
                  recent_records.append(item)

          # 由舊到新排序
          recent_records.sort(key=lambda x: x['_parsed_dt'])

          # 4. 上傳至 Garmin Connect（加入 1 秒緩衝延遲）
          uploaded = 0
          for item in recent_records:
              try:
                  body_indices = item.get("bodyIndexList", {})
                  sys_arr = body_indices.get("1")
                  dia_arr = body_indices.get("2")
                  pulse_arr = body_indices.get("3")

                  if not (sys_arr and dia_arr):
                      continue

                  sys_val = int(sys_arr[0])
                  dia_val = int(dia_arr[0])
                  pulse_val = int(pulse_arr[0]) if pulse_arr else None
                  time_str = item['_parsed_dt'].strftime("%Y-%m-%d %H:%M:%S")

                  garmin.set_blood_pressure(
                      systolic=sys_val,
                      diastolic=dia_val,
                      pulse=pulse_val,
                      timestamp=time_str
                  )
                  uploaded += 1
                  print(f"  [OK] Synced: {time_str} -> {sys_val}/{dia_val} mmHg (HR: {pulse_val})")
                  # 加入延遲以符合 Garmin API 頻率限制
                  time.sleep(1.2)
              except Exception as ex:
                  print(f"  [Skip/Err] {ex} - Item date: {item.get('measureDeviceDateFrom')}")

          print(f"\n==========================================")
          print(f"Successfully synced {uploaded}/{len(recent_records)} record(s) to Garmin Connect!")
          print(f"==========================================")
          EOF
