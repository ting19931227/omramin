name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上 8 點自動執行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Run Direct Python Sync
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          from omronconnect import OmronClient

          omron_user = os.environ['OMRON_EMAIL']
          omron_pwd = os.environ['OMRON_PASSWORD']

          print("1. Logging into OMRON Connect (TW)...")
          omron = OmronClient(country='TW')
          omron.login(omron_user, omron_pwd)
          print("OMRON Login successful!")

          # 列出所有可用的方法與資料
          methods = [m for m in dir(omron) if not m.startswith('_')]
          print("Available methods on OmronClient:", methods)
          EOF
