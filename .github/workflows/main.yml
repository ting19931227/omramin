name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上 8 點定時自動同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth httpx

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          from datetime import datetime
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          # 1. 載入 Garmin Token Session
          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON 並抓取血壓數據
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          client = omron._active_client
          hx = getattr(client, '_client', None)
          url = f"{client._server}{client._APP_URL}/versions/current/measureData"
          headers = client._headers

          now_ms = int(time.time() * 1000)
          payload = {
              "containCorrectedDataFlag": 1,
              "containAllDataTypeFlag": 1,
              "deviceCategory": "0",
              "searchDateFrom": 0,
              "searchDateTo": now_ms
          }

          resp = hx.post(url, json=payload, headers=headers)
          resp_json = resp.json()

          raw_records = []
          val = resp_json.get("returnedValue", {})
          if isinstance(val, list) and val:
              val = val[0]

          models = val.get("deviceModelList", []) if isinstance(val, dict) else []
          for m in models:
              for s in m.get("deviceSerialIDList", []):
                  user_num = s.get("userNumberInDevice", 1)
                  measures = s.get("measureList", [])
                  print(f"Device: {m.get('deviceModel')} (User {user_num}) -> {len(measures)} records")
                  raw_records.extend(measures)

          print(f"\nTotal extracted records: {len(raw_records)}")

          # 3. 解析 bodyIndexList 並上傳至 Garmin Connect
          if raw_records:
              print(f"\n3. Uploading {len(raw_records)} record(s) to Garmin Connect...")
              uploaded = 0
              # 依時間順序由舊到新排序上傳
              raw_records.sort(key=lambda x: str(x.get("measureDeviceDateFrom") or x.get("measureDateFrom", 0)))

              for item in raw_records:
                  try:
                      body_indices = item.get("bodyIndexList", {})
                      # 1: 收縮壓, 2: 舒張壓, 3: 脈搏
                      sys_arr = body_indices.get("1")
                      dia_arr = body_indices.get("2")
                      pulse_arr = body_indices.get("3")

                      if not (sys_arr and dia_arr):
                          continue

                      sys_val = int(sys_arr[0])
                      dia_val = int(dia_arr[0])
                      pulse_val = int(pulse_arr[0]) if pulse_arr else None

                      # 解析時間: 優先使用 17 碼或 14 碼 measureDeviceDateFrom (例: 20260910075833000)
                      dt_raw = str(item.get("measureDeviceDateFrom") or "")
                      if len(dt_raw) >= 14:
                          dt_obj = datetime.strptime(dt_raw[:14], "%Y%m%d%H%M%S")
                          time_str = dt_obj.strftime("%Y-%m-%d %H:%M:%S")
                      else:
                          ts_ms = item.get("measureDateFrom") or item.get("transferDate")
                          if ts_ms:
                              time_str = datetime.fromtimestamp(ts_ms / 1000.0).strftime("%Y-%m-%d %H:%M:%S")
                          else:
                              time_str = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

                      # 寫入 Garmin Connect
                      garmin.set_blood_pressure(
                          systolic=sys_val,
                          diastolic=dia_val,
                          pulse=pulse_val,
                          timestamp=time_str
                      )
                      uploaded += 1
                      print(f"  [OK] Synced: {time_str} -> {sys_val}/{dia_val} mmHg (HR: {pulse_val})")
                  except Exception as ex:
                      print(f"  [Skip/Err] {ex} - Item date: {item.get('measureDeviceDateFrom')}")

              print(f"\n==========================================")
              print(f"Successfully synced {uploaded}/{len(raw_records)} record(s) to Garmin Connect!")
              print(f"==========================================")
          else:
              print("\nNo records available to sync.")
          EOF
