name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Omramin Config and Sync Code
        run: |
          python - << 'EOF'
          with open("omramin.py", "r", encoding="utf-8") as f:
              code = f.read()

          print("=== CONFIG FILE PATH SEARCH ===")
          for line in code.splitlines():
              if "config" in line.lower() and (".json" in line.lower() or "load" in line.lower() or "path" in line.lower()):
                  print(line)

          print("\n=== SYNC FUNCTION / DEVICES SEARCH ===")
          for i, line in enumerate(code.splitlines()):
              if "no devices configured" in line.lower():
                  start = max(0, i - 15)
                  end = min(len(code.splitlines()), i + 10)
                  print("\n".join(code.splitlines()[start:end]))
                  break
          EOF
