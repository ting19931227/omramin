name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上 8 點自動執行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install keyrings.alt

      - name: Setup Config and Sync
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          OMRON_COUNTRY: "TW"
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_IS_CN: "0"
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          OMRAMIN_KEYRING_BACKEND: "file"
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import json
          import os

          config_data = {
              "omron": {
                  "email": os.environ["OMRON_EMAIL"],
                  "country": "TW",
                  "devices": [
                      {
                          "name": "HEM-6232T-AP:1",
                          "macaddr": "b2:ff:fe:c4:e1:3c",
                          "category": "BPM",
                          "user": 1,
                          "enabled": True
                      }
                  ]
              },
              "garmin": {
                  "email": os.environ["GARMIN_EMAIL"],
                  "is_cn": False
              }
          }

          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(config_data, f, indent=2)

          # 建立 keyrings.alt 純文字密鑰檔案，注入 Garmin Token
          token_dir = os.path.expanduser("~/.local/share/python_keyring")
          os.makedirs(token_dir, exist_ok=True)
          token_file = os.path.join(token_dir, "keyring_pass.cfg")

          garmin_email = os.environ["GARMIN_EMAIL"]
          garmin_token = os.environ["GARMIN_TOKENS"]

          with open(token_file, "w", encoding="utf-8") as f:
              f.write(f"[garmin]\n{garmin_email} = {garmin_token}\n")

          # 備份至專案目錄的 tokens.json 確保各種路徑讀取相容
          tokens_json = {
              f"garmin:{garmin_email}": garmin_token
          }
          with open("config.tokens.json", "w", encoding="utf-8") as f:
              json.dump(tokens_json, f, indent=2)

          print("Garmin OAuth Tokens injected successfully.")
          EOF

          echo "=== Starting Sync to Garmin Connect ==="
          omramin sync --days 90
