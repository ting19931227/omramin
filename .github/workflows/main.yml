name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install omramin
        run: |
          pip install "git+https://github.com/bugficks/omramin.git"

      - name: Fetch Devices from OMRON Cloud
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
        run: |
          python - << 'EOF'
          import os, asyncio
          from omronconnect import OmronConnectClient

          async def main():
              email = os.environ['OMRON_EMAIL']
              password = os.environ['OMRON_PASSWORD']
              print(f"Connecting to OMRON Cloud for: {email}")
              client = OmronConnectClient()
              await client.login(email, password)
              devices = await client.get_devices()
              print("\n=== YOUR OMRON DEVICES ===")
              for d in devices:
                  print(f"Device: {d}")
              print("==========================\n")

          asyncio.run(main())
          EOF
