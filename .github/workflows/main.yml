name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Fetch Devices and Measurements
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          from omronconnect import OmronClient

          omron_user = os.environ['OMRON_EMAIL']
          omron_pwd = os.environ['OMRON_PASSWORD']

          client = OmronClient(country='TW')
          client.login(omron_user, omron_pwd)
          print("OMRON Login successful!")

          print("\n=== REGISTERED DEVICES ===")
          devices = client.get_registered_devices(days=90)
          print(f"Found {len(devices)} device(s):")
          for dev in devices:
              print(f"  Device: {dev}")

          print("\n=== RECENT MEASUREMENTS ===")
          for dev in devices:
              try:
                  data = client.get_measurements(device=dev)
                  print(f"Device {dev} -> Records fetched: {len(data) if isinstance(data, list) else data}")
                  if isinstance(data, list) and data:
                      print(f"Sample: {data[0]}")
              except Exception as e:
                  print(f"Failed for device {dev}: {e}")
          EOF
