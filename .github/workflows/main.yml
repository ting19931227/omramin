name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "git+https://github.com/bugficks/omramin.git"

      - name: Check OmronConnect Signature
        run: |
          python - << 'EOF'
          import inspect
          from omronconnect import get_omron_connect, OmronConnect, OmronConnect1, OmronConnect2
          
          print("get_omron_connect:", inspect.signature(get_omron_connect))
          print("OmronConnect init:", inspect.signature(OmronConnect.__init__))
          print("OmronConnect1 init:", inspect.signature(OmronConnect1.__init__))
          print("OmronConnect2 init:", inspect.signature(OmronConnect2.__init__))
          EOF
