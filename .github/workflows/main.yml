name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Fetch Devices with OmronClient
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          from omronconnect import OmronClient

          email = os.environ['OMRON_EMAIL']
          password = os.environ['OMRON_PASSWORD']

          # 測試亞洲與常見國家代碼
          for country in ['TW', 'JP', 'US', 'GB']:
              print(f"--- Trying country: {country} ---")
              try:
                  client = OmronClient(country=country)
                  client.login(email, password)
                  devices = client.get_devices()
                  print(f"SUCCESS with country {country}!")
                  print("\n=== YOUR OMRON DEVICES ===")
                  for dev in devices:
                      print(dev)
                  print("==========================\n")
                  break
              except Exception as e:
                  print(f"Failed with {country}: {e}")
          EOF
