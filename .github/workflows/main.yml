name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          # 1. 載入 Garmin
          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          devices = omron.get_registered_devices(days=90)
          print(f"Found {len(devices)} device(s)")

          for dev in devices:
              print(f"\n--- Testing Raw API for {dev.name} ---")
              # 調用底層 request 或檢查內部 API 端點
              try:
                  # 檢查 omron 內部 session 是否能取得原始資料
                  if hasattr(omron, '_api_request'):
                      resp = omron._api_request("GET", f"devices/{dev.macaddr}/measurements")
                      print("Raw API Response:", resp)
                  elif hasattr(omron, '_request'):
                      resp = omron._request("GET", f"devices/{dev.macaddr}/measurements")
                      print("Raw API Response:", resp)
                  else:
                      print("Available methods in omron client:", [m for m in dir(omron) if not m.startswith('__')])
              except Exception as err:
                  print(f"Direct raw call error: {err}")

              # 呼叫 get_measurements 並檢視原始回傳
              records = omron.get_measurements(dev, searchDateFrom=0, searchDateTo=0)
              print("get_measurements result type:", type(records), "length:", len(records) if records else 0)
          EOF
