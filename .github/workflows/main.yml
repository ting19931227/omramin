name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install omramin
        run: |
          pip install "git+https://github.com/bugficks/omramin.git"

      - name: Create config file
        run: |
          mkdir -p ~/.config/omramin
          cat <<EOF > ~/.config/omramin/config.json
          {
            "omron": {
              "email": "${{ secrets.OMRON_EMAIL }}",
              "password": "${{ secrets.OMRON_PASSWORD }}"
            },
            "garmin": {
              "email": "${{ secrets.GARMIN_EMAIL }}",
              "password": "${{ secrets.GARMIN_PASSWORD }}"
            }
          }
          EOF

      - name: Check add options and try add
        run: |
          echo "=== ADD HELP ==="
          omramin add --help
          echo "=== TRY ADD ==="
          omramin add --all || omramin add --auto || omramin add || true
