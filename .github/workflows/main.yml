name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上 8 點自動同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth httpx

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import time
          from datetime import datetime
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          # 1. 載入 Garmin Token
          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON 並以 Minimal Payload 取得 measureList
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          client = omron._active_client
          hx = getattr(client, '_client', None)
          url = f"{client._server}{client._APP_URL}/versions/current/measureData"
          headers = client._headers

          now_ms = int(time.time() * 1000)
          payload = {
              "containCorrectedDataFlag": 1,
              "containAllDataTypeFlag": 1,
              "deviceCategory": "0",
              "searchDateFrom": 0,
              "searchDateTo": now_ms
          }

          resp = hx.post(url, json=payload, headers=headers)
          resp_json = resp.json()

          raw_records = []
          val = resp_json.get("returnedValue", {})
          if isinstance(val, list) and val:
              val = val[0]

          models = val.get("deviceModelList", []) if isinstance(val, dict) else []
          print(f"Found {len(models)} deviceModel block(s).")

          for m in models:
              for s in m.get("deviceSerialIDList", []):
                  user_num = s.get("userNumberInDevice", 1)
                  measures = s.get("measureList", [])
                  print(f"Device: {m.get('deviceModel')} (User {user_num}) -> {len(measures)} measure(s)")
                  raw_records.extend(measures)

          print(f"\nTotal extracted measure items: {len(raw_records)}")

          # 印出第一筆資料的真實鍵值，方便除錯
          if raw_records:
              print("\nSample item structure:")
              print(json.dumps(raw_records[0], ensure_ascii=False, indent=2))

          # 3. 解析並上傳至 Garmin Connect
          if raw_records:
              print(f"\n3. Uploading {len(raw_records)} record(s) to Garmin Connect...")
              uploaded = 0
              for item in raw_records:
                  try:
                      # 提取時間戳 (毫秒轉 datetime)
                      ts_ms = item.get("measureDateFrom") or item.get("measureDate") or item.get("transferDate")
                      if ts_ms and isinstance(ts_ms, (int, float)):
                          dt = datetime.fromtimestamp(ts_ms / 1000.0)
                          time_str = dt.strftime("%Y-%m-%d %H:%M:%S")
                      else:
                          time_str = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

                      # 提取收縮壓、舒張壓、心率 (涵蓋常見命名)
                      sys_val = item.get("maxBloodPressure") or item.get("systolic") or item.get("sys")
                      dia_val = item.get("minBloodPressure") or item.get("diastolic") or item.get("dia")
                      pulse_val = item.get("pulseRate") or item.get("pulse") or item.get("heartRate")

                      if sys_val is not None and dia_val is not None:
                          garmin.set_blood_pressure(
                              systolic=int(sys_val),
                              diastolic=int(dia_val),
                              pulse=int(pulse_val) if pulse_val else None,
                              timestamp=time_str
                          )
                          uploaded += 1
                          print(f"  [OK] Synced: {time_str} -> {sys_val}/{dia_val} mmHg (HR: {pulse_val})")
                      else:
                          print(f"  [Skip] Missing BP values in item: {item}")
                  except Exception as ex:
                      print(f"  [Err] {ex} - Item: {item}")

              print(f"\nSuccessfully synced {uploaded}/{len(raw_records)} record(s) to Garmin Connect!")
          else:
              print("\nNo measures found to sync.")
          EOF
