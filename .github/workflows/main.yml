name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上 8 點自動執行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          from datetime import datetime, timedelta
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          # 1. 驗證 Garmin Token Session
          print("1. Loading Garmin session using Token...")
          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON Connect (TW)
          print("\n2. Logging into OMRON Connect (TW)...")
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          devices = omron.get_registered_devices()
          print(f"Found {len(devices)} device(s):", [d.name for d in devices])

          # 設定日期範圍：過去 90 天到今天
          start_date = datetime.now() - timedelta(days=90)
          end_date = datetime.now()

          all_records = []
          for dev in devices:
              print(f"\nFetching data for {dev.name} (MAC: {dev.macaddr})...")
              fetched = None
              for try_call in [
                  lambda: omron.get_measurements(dev, start_date=start_date, end_date=end_date),
                  lambda: omron.get_measurements(dev, days=90),
                  lambda: omron.get_measurements(dev)
              ]:
                  try:
                      fetched = try_call()
                      if fetched:
                          break
                  except Exception:
                      pass

              if fetched:
                  print(f"  -> Found {len(fetched)} record(s)!")
                  all_records.extend(fetched)
              else:
                  print(f"  -> No records returned for {dev.name}.")

          print(f"\nTotal blood pressure records: {len(all_records)}")

          # 3. 上傳血壓數據至 Garmin Connect
          if all_records:
              print(f"\n3. Uploading to Garmin Connect...")
              uploaded = 0
              for r in all_records:
                  try:
                      timestamp = getattr(r, 'timestamp', None) or getattr(r, 'dateTime', None)
                      systolic = getattr(r, 'systolic', None)
                      diastolic = getattr(r, 'diastolic', None)
                      pulse = getattr(r, 'pulse', None) or getattr(r, 'heart_rate', None)

                      if isinstance(timestamp, str):
                          timestamp = datetime.fromisoformat(timestamp.replace("Z", "+00:00"))

                      time_str = timestamp.strftime("%Y-%m-%d %H:%M:%S") if timestamp else datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                      
                      garmin.set_blood_pressure(
                          systolic=int(systolic),
                          diastolic=int(diastolic),
                          pulse=int(pulse) if pulse else None,
                          timestamp=time_str
                      )
                      uploaded += 1
                      print(f"  [OK] Synced: {time_str} -> {systolic}/{diastolic} mmHg (HR: {pulse})")
                  except Exception as err:
                      print(f"  [Skip/Err] {err} - Raw: {r}")

              print(f"\nSuccessfully synced {uploaded}/{len(all_records)} record(s) to Garmin Connect!")
          else:
              print("\nHint: Please ensure your OMRON app has synced latest measurements to the cloud.")
          EOF
