name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth httpx

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import httpx
          from omronconnect import OmronClient

          print("Logging into OMRON Connect (TW)...")
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          client = omron._active_client
          hx = getattr(client, '_client', None)
          headers = client._headers

          print("\n=== Active Client Configuration ===")
          print("Base URL:", getattr(client, '_APP_URL', 'None'))
          print("Server:", getattr(client, '_server', 'None'))

          # 1. 檢視已註冊裝置的完整伺服器原始 JSON
          print("\n=== Probing Registered Devices Raw Data ===")
          try:
              dev_url = "https://data-jp.omronconnect.com/api/apps/1e3ddd17/server-code/versions/current/registeredDevices"
              r_dev = hx.post(dev_url, json={"days": 90}, headers=headers)
              print("registeredDevices response:", r_dev.text)
          except Exception as e:
              print("registeredDevices error:", e)

          # 2. 測試常見的歐姆龍雲端數據端點 (包含血壓日記、最新數據、用戶資料)
          test_endpoints = [
              ("latestMeasureData", {"deviceCategory": "0"}),
              ("bloodPressureDiary", {"searchDateFrom": 0, "searchDateTo": 0}),
              ("continuousData", {"deviceCategory": "0", "searchDateFrom": 0, "searchDateTo": 0}),
              ("panelData", {"searchDateFrom": 0, "searchDateTo": 0}),
              ("vitalData", {"category": "0"}),
          ]

          print("\n=== Probing Alternative Data Endpoints ===")
          for ep, payload in test_endpoints:
              url = f"https://data-jp.omronconnect.com/api/apps/1e3ddd17/server-code/versions/current/{ep}"
              try:
                  res = hx.post(url, json=payload, headers=headers)
                  print(f"\nEndpoint [{ep}] -> HTTP {res.status_code}")
                  if res.status_code == 200:
                      print("Response:", res.text[:400])
              except Exception as err:
                  print(f"Endpoint [{ep}] request failed:", err)
          EOF
