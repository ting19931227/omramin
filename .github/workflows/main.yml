name: Sync OMRON to Garmin

on:
  schedule:
    # 每天早上 8 點（UTC 0:00）自動執行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許隨時手動點按鈕執行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install omramin
        run: |
          pip install "git+https://github.com/bugficks/omramin.git"

      - name: Run sync
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          omramin sync
