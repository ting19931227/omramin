name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          # 1. 載入 Garmin
          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          # 檢查帳號資訊
          try:
              user_info = omron.get_user()
              print("\n--- OMRON User Info ---")
              print("User:", getattr(user_info, '__dict__', str(user_info)))
          except Exception as e:
              print("get_user failed:", e)

          devices = omron.get_registered_devices(days=90)
          print(f"\nFound {len(devices)} device(s):", [d.name for d in devices])

          # 檢查 _active_client 底層請求與日誌
          client = omron._active_client
          print("\nActive client type:", type(client))
          print("Active client attributes:", [a for a in dir(client) if not a.startswith('__')])

          # 嘗試攔截底層 get_measurements 呼叫
          for dev in devices:
              print(f"\nProbing device: {dev.name} (MAC: {dev.macaddr})")
              # 如果底層有 session / request 方法，測試直接調用
              if hasattr(client, 'get_measurements'):
                  try:
                      res = client.get_measurements(dev)
                      print("client.get_measurements result:", res)
                  except Exception as e:
                      print("client.get_measurements error:", e)

              # 印出實際發送的 URL 與 response
              if hasattr(client, 'session') and hasattr(client.session, 'hooks'):
                  def log_response(r, *args, **kwargs):
                      print(f"\n[HTTP {r.status_code}] {r.request.method} {r.request.url}")
                      print("Request Headers:", r.request.headers)
                      if r.request.body:
                          print("Request Body:", r.request.body)
                      print("Response Body (first 500 chars):", r.text[:500])
                  client.session.hooks['response'] = [log_response]

              records = omron.get_measurements(dev, searchDateFrom=0, searchDateTo=0)
              print("\nFinal get_measurements returned:", len(records) if records else 0, "records")
          EOF
