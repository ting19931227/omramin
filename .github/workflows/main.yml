name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          from datetime import datetime, timedelta
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          # 1. 載入 Garmin Token
          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 測試歐姆龍支援的所有區域代碼
          email = os.environ['OMRON_EMAIL']
          pwd = os.environ['OMRON_PASSWORD']

          # 測試台灣可能落入的不同國家/伺服器分區
          candidate_regions = ['TW', 'AP', 'SG', 'HK', 'US', 'DE']
          target_omron = None
          target_records = []

          print("\n=== Testing OMRON Region Servers ===")
          for reg in candidate_regions:
              try:
                  print(f"\n[Region: {reg}] Trying login & fetch...")
                  client = OmronClient(country=reg)
                  client.login(email, pwd)
                  devs = client.get_registered_devices(days=90)
                  print(f"  -> Connected! Found {len(devs)} device(s): {[d.name for d in devs]}")
                  
                  for d in devs:
                      # 測試查詢 14 碼與 0 範圍
                      recs = client.get_measurements(d, searchDateFrom=0, searchDateTo=0)
                      print(f"  -> Device {d.name} returned {len(recs)} records")
                      if recs:
                          target_records = recs
                          target_omron = client
                          print(f"  ===> MATCH FOUND ON REGION [{reg}]! <===")
                          break

                  if target_records:
                      break
              except Exception as e:
                  print(f"  -> Region {reg} failed/unsupported: {e}")

          print(f"\n==========================================")
          print(f"Total blood pressure records found: {len(target_records)}")
          print(f"==========================================")

          # 3. 上傳至 Garmin
          if target_records:
              print(f"\n3. Uploading to Garmin Connect...")
              uploaded = 0
              for r in target_records:
                  try:
                      timestamp = getattr(r, 'measure_date', None) or getattr(r, 'timestamp', None) or getattr(r, 'dateTime', None)
                      systolic = getattr(r, 'systolic', None)
                      diastolic = getattr(r, 'diastolic', None)
                      pulse = getattr(r, 'pulse', None) or getattr(r, 'heart_rate', None)

                      if isinstance(timestamp, str):
                          timestamp = datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
                      elif isinstance(timestamp, (int, float)):
                          timestamp = datetime.fromtimestamp(timestamp / 1000 if timestamp > 1e11 else timestamp)

                      time_str = timestamp.strftime("%Y-%m-%d %H:%M:%S") if isinstance(timestamp, datetime) else datetime.now().strftime("%Y-%m-%d %H:%M:%S")

                      garmin.set_blood_pressure(
                          systolic=int(systolic),
                          diastolic=int(diastolic),
                          pulse=int(pulse) if pulse else None,
                          timestamp=time_str
                      )
                      uploaded += 1
                      print(f"  [OK] Synced: {time_str} -> {systolic}/{diastolic} mmHg (HR: {pulse})")
                  except Exception as err:
                      print(f"  [Skip/Err] {err} - {r}")

              print(f"\nSuccessfully synced {uploaded}/{len(target_records)} record(s) to Garmin Connect!")
          EOF
