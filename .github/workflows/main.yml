name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Inspect CLI Options and Environment Variables
        run: |
          echo "=== 1. Main Help ==="
          omramin --help
          echo "=== 2. Sync Command Help ==="
          omramin sync --help
          echo "=== 3. Login Functions Env Vars ==="
          python - << 'EOF'
          with open("omramin.py", "r", encoding="utf-8") as f:
              for line in f:
                  if "_E(" in line or "environ" in line:
                      print(line.strip())
          EOF
