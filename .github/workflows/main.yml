name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth httpx

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          from datetime import datetime, timedelta
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          # 1. 載入 Garmin Token
          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          client = omron._active_client
          hx = getattr(client, '_client', None)

          now = datetime.now()
          d_from = int((now - timedelta(days=90)).strftime("%Y%m%d000000"))
          d_to = int(now.strftime("%Y%m%d235959"))

          # 測試不同的 API Payload 組合直接向伺服器調用
          url = f"{client._APP_URL}/measureData"
          headers = client._headers

          print(f"\nQuerying OMRON cloud from {d_from} to {d_to}...")

          # 組合 1: 僅以分類 0 (血壓) + 14碼時間查詢 (不綁 deviceModel，避免型號名稱不匹配)
          payloads = [
              {"name": "No-Model Filter (14-digit)", "data": {"deviceCategory": "0", "searchDateFrom": d_from, "searchDateTo": d_to}},
              {"name": "No-Model Filter (0, 0)", "data": {"deviceCategory": "0", "searchDateFrom": 0, "searchDateTo": 0}},
              {"name": "With Model List (HEM-6232T)", "data": {"deviceCategory": "0", "deviceModelList": [{"deviceModel": "HEM-6232T"}], "searchDateFrom": 0, "searchDateTo": 0}}
          ]

          raw_records = []
          for p in payloads:
              print(f"\n-> Trying payload: {p['name']}")
              try:
                  resp = hx.post(url, json=p['data'], headers=headers)
                  print(f"Status: {resp.status_code}")
                  res_json = resp.json()
                  print("Response preview:", json.dumps(res_json, ensure_ascii=False)[:300])

                  returned = res_json.get("returnedValue", {})
                  model_list = returned.get("deviceModelList")
                  if model_list:
                      print(f"  ==> SUCCESS! Found data in deviceModelList!")
                      # 解析回傳的量測資料
                      for m in model_list:
                          for user in m.get("userDataList", []):
                              for item in user.get("measurementDataList", []):
                                  raw_records.append(item)
                      if raw_records:
                          break
              except Exception as err:
                  print("Request error:", err)

          print(f"\nTotal blood pressure records extracted: {len(raw_records)}")

          # 3. 上傳至 Garmin
          if raw_records:
              print(f"\n3. Uploading {len(raw_records)} record(s) to Garmin Connect...")
              uploaded = 0
              for item in raw_records:
                  try:
                      # 歐姆龍 JSON 典型欄位：measureDate, sys, dia, pulse
                      dt_raw = str(item.get("measureDate") or item.get("measurementDate") or item.get("dateTime"))
                      sys_val = item.get("sys") or item.get("systolic")
                      dia_val = item.get("dia") or item.get("diastolic")
                      pulse_val = item.get("pulse") or item.get("heartRate")

                      # 解析 YYYYMMDDhhmmss
                      if len(dt_raw) >= 14:
                          dt_obj = datetime.strptime(dt_raw[:14], "%Y%m%d%H%M%S")
                          time_str = dt_obj.strftime("%Y-%m-%d %H:%M:%S")
                      else:
                          time_str = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

                      garmin.set_blood_pressure(
                          systolic=int(sys_val),
                          diastolic=int(dia_val),
                          pulse=int(pulse_val) if pulse_val else None,
                          timestamp=time_str
                      )
                      uploaded += 1
                      print(f"  [OK] Synced: {time_str} -> {sys_val}/{dia_val} mmHg (HR: {pulse_val})")
                  except Exception as ex:
                      print(f"  [Skip/Err] {ex} - Item: {item}")

              print(f"\nCompleted! Synced {uploaded}/{len(raw_records)} record(s) to Garmin Connect!")
          else:
              print("\nNo records extracted from responses.")
          EOF
