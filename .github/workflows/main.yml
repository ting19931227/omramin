name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth httpx

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import time
          from datetime import datetime, timezone, timedelta
          import garth
          import httpx
          from omronconnect import OmronClient

          # 1. 載入 Garmin Token Session
          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          garth.client.loads(garmin_tokens)
          print("Garmin session loaded successfully!")

          # 檢查 OAuth2 Token 狀態
          oauth2 = getattr(garth.client, "oauth2_token", None)
          token_str = None
          if oauth2:
              token_str = oauth2.get("access_token") if isinstance(oauth2, dict) else getattr(oauth2, "access_token", None)
          print(f"OAuth2 Bearer Token available: {'Yes' if token_str else 'No'}")

          # 2. 登入 OMRON 並抓取血壓
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          client = omron._active_client
          hx = getattr(client, '_client', None)
          url = f"{client._server}{client._APP_URL}/versions/current/measureData"
          headers = client._headers

          now_ms = int(time.time() * 1000)
          payload = {
              "containCorrectedDataFlag": 1,
              "containAllDataTypeFlag": 1,
              "deviceCategory": "0",
              "searchDateFrom": 0,
              "searchDateTo": now_ms
          }

          resp = hx.post(url, json=payload, headers=headers)
          resp_json = resp.json()

          raw_records = []
          val = resp_json.get("returnedValue", {})
          if isinstance(val, list) and val:
              val = val[0]

          models = val.get("deviceModelList", []) if isinstance(val, dict) else []
          for m in models:
              for s in m.get("deviceSerialIDList", []):
                  raw_records.extend(s.get("measureList", []))

          print(f"Total extracted records from OMRON: {len(raw_records)}")

          # 篩選最新 14 天內紀錄
          cutoff_date = datetime.now() - timedelta(days=14)
          recent_records = []
          for item in raw_records:
              dt_raw = str(item.get("measureDeviceDateFrom") or "")
              if len(dt_raw) >= 14:
                  dt_obj = datetime.strptime(dt_raw[:14], "%Y%m%d%H%M%S")
                  if dt_obj >= cutoff_date:
                      item['_parsed_dt'] = dt_obj
                      recent_records.append(item)

          if not recent_records and raw_records:
              raw_records.sort(key=lambda x: str(x.get("measureDeviceDateFrom") or 0), reverse=True)
              latest = raw_records[0]
              dt_raw = str(latest.get("measureDeviceDateFrom") or "")
              latest['_parsed_dt'] = datetime.strptime(dt_raw[:14], "%Y%m%d%H%M%S") if len(dt_raw) >= 14 else datetime.now()
              recent_records.append(latest)

          print(f"Targeting {len(recent_records)} record(s) for sync.")

          # 3. 寫入 Garmin Connect (直接帶完整 Bearer 標頭發送)
          garmin_bp_url = "https://connectapi.garmin.com/bloodpressure-service/bloodpressure"

          # 建立專用 Headers
          garmin_headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Origin": "https://connect.garmin.com",
              "Referer": "https://connect.garmin.com/",
              "di-backend": "connectapi.garmin.com",
              "Content-Type": "application/json"
          }
          if token_str:
              garmin_headers["Authorization"] = f"Bearer {token_str}"

          uploaded = 0
          with httpx.Client(timeout=15.0) as g_client:
              for item in recent_records:
                  body_indices = item.get("bodyIndexList", {})
                  sys_val = int(body_indices["1"][0])
                  dia_val = int(body_indices["2"][0])
                  pulse_val = int(body_indices["3"][0]) if "3" in body_indices else None
                  dt_local = item['_parsed_dt']

                  # 台灣時間 UTC+8 轉 UTC
                  tz_tw = timezone(timedelta(hours=8))
                  dt_with_tz = dt_local.replace(tzinfo=tz_tw)
                  dt_utc = dt_with_tz.astimezone(timezone.utc)
                  iso_utc_str = dt_utc.strftime("%Y-%m-%dT%H:%M:%S.000Z")
                  local_str = dt_local.strftime("%Y-%m-%d %H:%M:%S")

                  bp_payload = {
                      "measurementTimestampLocal": local_str.replace(" ", "T"),
                      "measurementTimestampGMT": iso_utc_str,
                      "systolic": sys_val,
                      "diastolic": dia_val,
                      "pulse": pulse_val,
                      "sourceType": "MANUAL"
                  }

                  print(f"\nPosting to Garmin: {local_str} -> {sys_val}/{dia_val} mmHg (Pulse: {pulse_val})")

                  try:
                      r = g_client.post(garmin_bp_url, json=bp_payload, headers=garmin_headers)
                      print(f"  Response Status: HTTP {r.status_code}")
                      if r.status_code in [200, 201, 204]:
                          print(f"  [OK] Synced successfully to Garmin Connect!")
                          uploaded += 1
                      else:
                          print(f"  [Failed] Body: {r.text}")
                  except Exception as ex:
                      print(f"  [Error] {ex}")

          print(f"\n==========================================")
          print(f"Sync complete: {uploaded}/{len(recent_records)} uploaded.")
          print(f"==========================================")
          EOF
