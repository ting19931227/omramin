name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間 20:00 自動執行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth httpx

      - name: Direct Sync
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_PROXY: ${{ secrets.GARMIN_PROXY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import time
          from datetime import datetime, timezone, timedelta
          import garth
          import httpx
          from garminconnect import Garmin
          from omronconnect import OmronClient

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          garmin_proxy = os.environ.get('GARMIN_PROXY', '').strip()

          # 1. 設置 Proxy 避開 Cloudflare 429 機房封鎖
          if garmin_proxy:
              print("1. Hooking Webshare Proxy for Garmin connection...")
              garth.client.sess.proxies = {
                  "http": garmin_proxy,
                  "https": garmin_proxy
              }
              print("  Proxy successfully configured.")

          # 2. 載入憑證並透過 Proxy 換取全新 Bearer Token
          if garmin_tokens:
              print("-> Using GARMIN_TOKENS with Proxy refresh...")
              garth.client.loads(garmin_tokens)
              try:
                  garth.client.refresh_oauth2()
                  print("  [OK] Successfully refreshed OAuth2 Token via Proxy!")
              except Exception as r_err:
                  print(f"  [Notice] OAuth2 refresh attempt: {r_err}")
              garmin = Garmin(is_cn=False)
              garmin.client = garth.client
          else:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          oauth2 = getattr(garth.client, "oauth2_token", None)
          token_str = oauth2.get("access_token") if isinstance(oauth2, dict) else getattr(oauth2, "access_token", None)

          if hasattr(garth.client, "sess") and hasattr(garth.client.sess, "headers"):
              garth.client.sess.headers.update({
                  "Authorization": f"Bearer {token_str}",
                  "Origin": "https://connect.garmin.com",
                  "Referer": "https://connect.garmin.com/",
                  "di-backend": "connectapi.garmin.com",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              })
          print("Garmin headers configured with active OAuth2 Bearer Token.")

          # 3. 登入 OMRON 並抓取血壓數據
          print("\n2. Logging into OMRON Connect...")
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          client = omron._active_client
          hx = getattr(client, '_client', None)
          url = f"{client._server}{client._APP_URL}/versions/current/measureData"

          now_ms = int(time.time() * 1000)
          payload = {
              "containCorrectedDataFlag": 1,
              "containAllDataTypeFlag": 1,
              "deviceCategory": "0",
              "searchDateFrom": 0,
              "searchDateTo": now_ms
          }

          resp = hx.post(url, json=payload, headers=client._headers)
          val = resp.json().get("returnedValue", {})
          if isinstance(val, list) and val:
              val = val[0]

          raw_records = []
          for m in val.get("deviceModelList", []):
              for s in m.get("deviceSerialIDList", []):
                  raw_records.extend(s.get("measureList", []))

          # 關鍵修改：以台灣時間 (UTC+8) 計算昨天的 00:00:00，只保留昨天與今天的資料
          tz_tw = timezone(timedelta(hours=8))
          now_tw = datetime.now(tz_tw)
          today_midnight = now_tw.replace(hour=0, minute=0, second=0, microsecond=0)
          yesterday_midnight = (today_midnight - timedelta(days=1)).replace(tzinfo=None)

          print(f"Filtering records from yesterday onwards (>= {yesterday_midnight.strftime('%Y-%m-%d %H:%M:%S')})...")

          target_records = []
          for item in raw_records:
              dt_raw = str(item.get("measureDeviceDateFrom") or "")
              if len(dt_raw) >= 14:
                  dt_obj = datetime.strptime(dt_raw[:14], "%Y%m%d%H%M%S")
                  if dt_obj >= yesterday_midnight:
                      item['_parsed_dt'] = dt_obj
                      target_records.append(item)

          target_records.sort(key=lambda x: x['_parsed_dt'])
          print(f"Syncing {len(target_records)} record(s) from yesterday & today...")

          uploaded = 0
          for item in target_records:
              try:
                  body_indices = item.get("bodyIndexList", {})
                  sys_val = int(body_indices["1"][0])
                  dia_val = int(body_indices["2"][0])
                  pulse_val = int(body_indices["3"][0]) if "3" in body_indices else None
                  time_str = item['_parsed_dt'].strftime("%Y-%m-%d %H:%M:%S")

                  garmin.set_blood_pressure(
                      systolic=sys_val,
                      diastolic=dia_val,
                      pulse=pulse_val,
                      timestamp=time_str
                  )
                  uploaded += 1
                  print(f"  [OK] Synced: {time_str} -> {sys_val}/{dia_val} mmHg (HR: {pulse_val})")
                  time.sleep(1.2)
              except Exception as err:
                  print(f"  [Skip/Err] {err} ({time_str})")

          print(f"\nCompleted: Synced {uploaded}/{len(target_records)} record(s) to Garmin Connect.")
          EOF
