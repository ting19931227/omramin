name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth httpx

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          # 1. 載入 Garmin
          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          devices = omron.get_registered_devices(days=90)
          print(f"Found {len(devices)} device(s)")

          client = omron._active_client
          hx = getattr(client, '_client', None)

          # 攔截 httpx 回應並印出實際 URL 與 Body
          if hx:
              orig_send = hx.send
              def custom_send(request, *args, **kwargs):
                  resp = orig_send(request, *args, **kwargs)
                  print(f"\n[HTTP {resp.status_code}] {request.method} {request.url}")
                  print("Response body:", resp.text[:1000])
                  return resp
              hx.send = custom_send

          for dev in devices:
              print(f"\nProbing get_measurements for {dev.name}...")
              records = omron.get_measurements(dev, searchDateFrom=0, searchDateTo=0)
              print(f"Parsed records count: {len(records) if records else 0}")
          EOF
