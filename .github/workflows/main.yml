name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "git+https://github.com/bugficks/omramin.git"

      - name: Login and Fetch Devices
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          from omronconnect import try_servers

          email = os.environ['OMRON_EMAIL']
          password = os.environ['OMRON_PASSWORD']

          # 優先嘗試台灣/亞洲常見區域代碼 (TW, JP, US, DE)
          client = None
          for country in ['TW', 'JP', 'US', 'DE']:
              print(f"Trying country: {country}...")
              try:
                  client = try_servers(email, password, country=country)
                  if client:
                      print(f"Login success with country: {country}!")
                      break
              except Exception as e:
                  print(f"Failed with {country}: {e}")

          if not client:
              print("Trying default try_servers without country...")
              client = try_servers(email, password)

          devices = client.get_devices()
          print("\n=== FOUND OMRON DEVICES ===")
          for dev in devices:
              print(f"Device: {dev}")
          print("===========================\n")
          EOF
