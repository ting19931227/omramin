name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth httpx

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import time
          from datetime import datetime
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          # 1. 載入 Garmin Token
          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          client = omron._active_client
          hx = getattr(client, '_client', None)

          devs = omron.get_registered_devices(days=90)
          dev = devs[0]
          print(f"\nTarget device vars: {getattr(dev, '__dict__', str(dev))}")

          # 正確的 API 完整端點
          url = f"{client._server}{client._APP_URL}/versions/current/measureData"
          headers = client._headers
          now_ms = int(time.time() * 1000)

          # 測試不同的 serial / user 組合
          serial_val = getattr(dev, 'serial', None) or dev.macaddr
          category_val = dev.category.value if hasattr(dev.category, 'value') else str(dev.category)

          payload_candidates = [
              # 組合 A: 官方代碼完整結構 (帶 serial)
              ("Standard with Serial", {
                  "containCorrectedDataFlag": 1,
                  "containAllDataTypeFlag": 1,
                  "deviceCategory": category_val,
                  "deviceSerialID": str(serial_val),
                  "userNumberInDevice": int(dev.user),
                  "searchDateFrom": 0,
                  "searchDateTo": now_ms
              }),
              # 組合 B: 不帶 serialID (帳號級血壓查詢)
              ("Without SerialID", {
                  "containCorrectedDataFlag": 1,
                  "containAllDataTypeFlag": 1,
                  "deviceCategory": category_val,
                  "userNumberInDevice": int(dev.user),
                  "searchDateFrom": 0,
                  "searchDateTo": now_ms
              }),
              # 組合 C: 不帶 userNumber (廣域查詢)
              ("Without userNumber", {
                  "containCorrectedDataFlag": 1,
                  "containAllDataTypeFlag": 1,
                  "deviceCategory": category_val,
                  "searchDateFrom": 0,
                  "searchDateTo": now_ms
              }),
              # 組合 D: 最小必要參數
              ("Minimal Payload", {
                  "deviceCategory": category_val,
                  "searchDateFrom": 0,
                  "searchDateTo": now_ms
              })
          ]

          raw_records = []
          for name, p in payload_candidates:
              print(f"\nTesting: {name}")
              try:
                  res = hx.post(url, json=p, headers=headers)
                  print(f"HTTP Status: {res.status_code}")
                  res_json = res.json()
                  print("Response body preview:", json.dumps(res_json, ensure_ascii=False)[:300])

                  val = res_json.get("returnedValue", {})
                  if isinstance(val, list) and val:
                      val = val[0]

                  models = val.get("deviceModelList") if isinstance(val, dict) else None
                  if models:
                      print(f"  ===> SUCCESS! Found {len(models)} model group(s) via [{name}]!")
                      for m in models:
                          for u in m.get("userDataList", []):
                              for item in u.get("measurementDataList", []):
                                  raw_records.append(item)
                      if raw_records:
                          break
              except Exception as err:
                  print(f"Error testing {name}: {err}")

          print(f"\nExtracted total blood pressure records: {len(raw_records)}")

          # 3. 上傳至 Garmin Connect
          if raw_records:
              print(f"\n3. Uploading {len(raw_records)} record(s) to Garmin Connect...")
              uploaded = 0
              for item in raw_records:
                  try:
                      # 歐姆龍欄位解析 (通常為 measurementDate, sys, dia, pulse)
                      dt_raw = str(item.get("measureDate") or item.get("measurementDate") or item.get("dateTime") or item.get("measureDateTime"))
                      sys_val = item.get("sys") or item.get("systolic")
                      dia_val = item.get("dia") or item.get("diastolic")
                      pulse_val = item.get("pulse") or item.get("heartRate")

                      if len(dt_raw) >= 14:
                          dt_obj = datetime.strptime(dt_raw[:14], "%Y%m%d%H%M%S")
                          time_str = dt_obj.strftime("%Y-%m-%d %H:%M:%S")
                      else:
                          time_str = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

                      garmin.set_blood_pressure(
                          systolic=int(sys_val),
                          diastolic=int(dia_val),
                          pulse=int(pulse_val) if pulse_val else None,
                          timestamp=time_str
                      )
                      uploaded += 1
                      print(f"  [OK] Synced to Garmin: {time_str} -> {sys_val}/{dia_val} mmHg (HR: {pulse_val})")
                  except Exception as ex:
                      print(f"  [Skip/Err] {ex} - Raw: {item}")

              print(f"\nSuccessfully synced {uploaded}/{len(raw_records)} record(s) to Garmin Connect!")
          else:
              print("\nNo records extracted.")
          EOF
