name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上 8 點自動執行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Configure Omramin and Sync
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python - << 'EOF'
          import json
          import os

          # 建立 omramin 所需的設定檔結構
          config_path = os.path.expanduser("~/.config/omramin/config.json")
          os.makedirs(os.path.dirname(config_path), exist_ok=True)

          device = {
              "name": "HEM-6232T-AP:1",
              "macaddr": "b2:ff:fe:c4:e1:3c",
              "category": "BPM",
              "user": 1,
              "enabled": True
          }

          config_data = {
              "devices": [device]
          }

          with open(config_path, "w", encoding="utf-8") as f:
              json.dump(config_data, f, indent=2)

          print(f"Config successfully written to {config_path}:")
          print(json.dumps(config_data, indent=2))
          EOF

          # 執行原生 omramin 抓取 90 天數據同步到 Garmin
          omramin sync --days 90
