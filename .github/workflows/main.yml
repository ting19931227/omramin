name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上 8 點自動同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Generate Config and Sync
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python - << 'EOF'
          import json
          import os

          config_data = {
              "omron": {
                  "email": os.environ["OMRON_EMAIL"],
                  "country": "TW",
                  "devices": [
                      {
                          "name": "HEM-6232T-AP:1",
                          "macaddr": "b2:ff:fe:c4:e1:3c",
                          "category": "BPM",
                          "user": 1,
                          "enabled": True
                      }
                  ]
              },
              "garmin": {
                  "email": os.environ["GARMIN_EMAIL"]
              }
          }

          # 寫入當前目錄的 config.json (符合 omramin 優先讀取規則)
          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(config_data, f, indent=2)

          print("Generated config.json successfully:")
          print(json.dumps(config_data, indent=2))
          EOF

          echo "=== 1. Checking configured devices ==="
          omramin list-devices

          echo "=== 2. Running Sync to Garmin Connect ==="
          omramin sync --days 90
