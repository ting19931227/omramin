name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Omron Connect Source
        run: |
          python - << 'EOF'
          import inspect
          import omronconnect
          print("=== try_servers signature ===")
          print(inspect.signature(omronconnect.try_servers))
          print("=== omronconnect source lines ===")
          lines = inspect.getsourcelines(omronconnect.try_servers)[0]
          print("".join(lines[:25]))
          EOF
