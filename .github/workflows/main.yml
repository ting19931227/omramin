name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Discovery in omramin.py
        run: |
          python - << 'EOF'
          with open("omramin.py", "r", encoding="utf-8") as f:
              lines = f.readlines()
          for i, line in enumerate(lines):
              if "omron" in line.lower() and ("list" in line.lower() or "device" in line.lower() or "discover" in line.lower()):
                  start = max(0, i - 2)
                  end = min(len(lines), i + 20)
                  print("".join(lines[start:end]))
                  print("="*40)
                  break
          EOF
