name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install garminconnect garth

      - name: Direct Sync with Token
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import os
          import sys
          from dataclasses import replace
          from datetime import datetime, timedelta
          import garth
          from garminconnect import Garmin
          from omronconnect import OmronClient

          garmin_tokens = os.environ.get('GARMIN_TOKENS', '').strip()
          if not garmin_tokens:
              print("Error: GARMIN_TOKENS is missing.")
              sys.exit(1)

          # 1. 載入 Garmin
          garth.client.loads(garmin_tokens)
          garmin = Garmin(is_cn=False)
          garmin.client = garth.client
          print("Garmin session loaded successfully!")

          # 2. 登入 OMRON
          omron = OmronClient(country='TW')
          omron.login(os.environ['OMRON_EMAIL'], os.environ['OMRON_PASSWORD'])
          print("OMRON Login successful.")

          devices = omron.get_registered_devices(days=90)
          print(f"Found {len(devices)} device(s)")

          # 準備日期範圍
          now = datetime.now()
          d_from_14 = int((now - timedelta(days=90)).strftime("%Y%m%d000000"))
          d_to_14 = int(now.strftime("%Y%m%d235959"))
          d_from_8 = int((now - timedelta(days=90)).strftime("%Y%m%d"))
          d_to_8 = int(now.strftime("%Y%m%d"))

          all_records = []
          for base_dev in devices:
              print(f"\nTarget Device: {base_dev.name} (MAC: {base_dev.macaddr}, Registered User: {base_dev.user})")
              
              # 依序測試原登記 User 以及 User 1、User 2
              tested_users = [base_dev.user] if base_dev.user else [1, 2]
              if 1 not in tested_users: tested_users.append(1)
              if 2 not in tested_users: tested_users.append(2)

              for u in tested_users:
                  dev = replace(base_dev, user=u)
                  print(f"--- Checking for User {u} ---")

                  # 嘗試三種可能被 API 接受的日期格式
                  attempts = [
                      ("14-digit (YYYYMMDDhhmmss)", d_from_14, d_to_14),
                      ("8-digit (YYYYMMDD)", d_from_8, d_to_8),
                      ("Zero-range (0, 0)", 0, 0),
                  ]

                  for label, f_from, f_to in attempts:
                      try:
                          rec = omron.get_measurements(dev, searchDateFrom=f_from, searchDateTo=f_to)
                          count = len(rec) if rec else 0
                          print(f"  [{label}] -> {count} records")
                          if count > 0:
                              all_records.extend(rec)
                              break
                      except Exception as err:
                          print(f"  [{label}] error: {err}")

                  if all_records:
                      break

          print(f"\nTotal blood pressure records fetched: {len(all_records)}")

          # 3. 上傳至 Garmin
          if all_records:
              print(f"\n3. Uploading {len(all_records)} record(s) to Garmin Connect...")
              uploaded = 0
              for r in all_records:
                  try:
                      timestamp = getattr(r, 'measure_date', None) or getattr(r, 'timestamp', None) or getattr(r, 'dateTime', None)
                      systolic = getattr(r, 'systolic', None)
                      diastolic = getattr(r, 'diastolic', None)
                      pulse = getattr(r, 'pulse', None) or getattr(r, 'heart_rate', None)

                      if isinstance(timestamp, str):
                          timestamp = datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
                      elif isinstance(timestamp, (int, float)):
                          timestamp = datetime.fromtimestamp(timestamp / 1000 if timestamp > 1e11 else timestamp)

                      time_str = timestamp.strftime("%Y-%m-%d %H:%M:%S") if isinstance(timestamp, datetime) else datetime.now().strftime("%Y-%m-%d %H:%M:%S")

                      garmin.set_blood_pressure(
                          systolic=int(systolic),
                          diastolic=int(diastolic),
                          pulse=int(pulse) if pulse else None,
                          timestamp=time_str
                      )
                      uploaded += 1
                      print(f"  [OK] Synced: {time_str} -> {systolic}/{diastolic} mmHg (HR: {pulse})")
                  except Exception as err:
                      print(f"  [Skip/Err] {err} - {r}")

              print(f"\nSuccessfully synced {uploaded}/{len(all_records)} record(s) to Garmin Connect!")
          else:
              print("\nNo records found across all formats.")
          EOF
