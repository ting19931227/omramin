name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Verify Login and List Devices
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
        run: |
          python - << 'EOF'
          import os
          from omronconnect import OmronClient

          email = os.environ['OMRON_EMAIL']
          password = os.environ['OMRON_PASSWORD']

          print(f"Connecting to OMRON with: {email}")
          
          # 嘗試台灣與亞洲伺服器
          for country in ['TW', 'JP', 'US', 'GB']:
              print(f"\n--- Trying country: {country} ---")
              try:
                  client = OmronClient(country=country)
                  login_resp = client.login(email, password)
                  print("Login response:", login_resp)
                  
                  # 檢查登入後取得的血壓計設備
                  print("Inspecting client attributes:")
                  for attr in ['devices', 'device_list', '_devices']:
                      if hasattr(client, attr):
                          print(f"  {attr}: {getattr(client, attr)}")
                  
                  if hasattr(client, 'client') and hasattr(client.client, 'get_devices'):
                      devs = client.client.get_devices()
                      print("Found devices via inner client:", devs)
                  
                  print(f"SUCCESS with {country}!")
                  break
              except Exception as e:
                  print(f"Failed with {country}: {e}")
          EOF
