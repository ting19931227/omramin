name: Sync OMRON to Garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 每天台灣時間晚上 8 點自動同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          # 安裝 keyrings.alt 支援在無 GUI 的 Linux Actions 環境下儲存 token
          pip install keyrings.alt

      - name: Generate Config and Sync
        env:
          OMRON_EMAIL: ${{ secrets.OMRON_EMAIL }}
          OMRON_PASSWORD: ${{ secrets.OMRON_PASSWORD }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'EOF'
          import json
          import os

          config_data = {
              "omron": {
                  "email": os.environ["OMRON_EMAIL"],
                  "country": "TW",
                  "devices": [
                      {
                          "name": "HEM-6232T-AP:1",
                          "macaddr": "b2:ff:fe:c4:e1:3c",
                          "category": "BPM",
                          "user": 1,
                          "enabled": True
                      }
                  ]
              },
              "garmin": {
                  "email": os.environ["GARMIN_EMAIL"]
              }
          }

          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(config_data, f, indent=2)

          print("Generated config.json successfully.")
          EOF

          # 直接透過參數傳遞憑證執行同步
          omramin sync --days 90 \
            --omron-email "$OMRON_EMAIL" \
            --omron-password "$OMRON_PASSWORD" \
            --garmin-email "$GARMIN_EMAIL" \
            --garmin-password "$GARMIN_PASSWORD"
