name: Sync OMRON to Garmin

on:
  workflow_dispatch: # 支援手動點擊同步
  schedule:
    - cron: '0 21 * * *' # 每天台灣時間早上 05:00 自動執行 (UTC 21:00)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install omramin
        run: |
          pip install -e .

      - name: Setup Config
        run: |
          mkdir -p ~/.config/omramin
          cat <<EOF > ~/.config/omramin/config.json
          {
            "omron": {
              "email": "${{ secrets.OMRON_EMAIL }}",
              "password": "${{ secrets.OMRON_PASSWORD }}",
              "country": "TW"
            },
            "garmin": {
              "email": "${{ secrets.GARMIN_EMAIL }}",
              "password": "${{ secrets.GARMIN_PASSWORD }}"
            },
            "devices": {
              "BP Monitor": {
                "category": "bpm",
                "user": 1
              }
            }
          }
          EOF

      - name: Run sync
        run: |
          omramin sync --days 90
