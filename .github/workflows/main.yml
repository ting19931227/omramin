name: Sync OMRON to Garmin

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install omramin
        run: |
          pip install "git+https://github.com/bugficks/omramin.git"

      - name: Inspect OmronConnect Module
        run: |
          python -c "import omronconnect; print(dir(omronconnect))"
